name: Close issues waiting on the reporter

# Only issues labelled `needs-info` (we asked for a version, logs or a repro and got no reply)
# go stale. Confirmed bugs and feature requests are never auto-closed.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: needs-info
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue is waiting for the information requested above (versions, logs or a reproduction).
            It will be closed in 7 days if there is no reply. Commenting keeps it open.
          close-issue-message: >
            Closing because the requested information didn't arrive. If you still see the problem on the
            latest version, comment with the details and it will be reopened.
          days-before-pr-stale: -1
          days-before-pr-close: -1
